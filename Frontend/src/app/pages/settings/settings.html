<div class="settings-page">

  <ng-container *ngIf="!activeView">
    <div class="page-header">
      <div>
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">Open one workspace, finish it, then move to the next.</p>
      </div>

      <div class="studio-badge" *ngIf="!isLoading()">
        <img *ngIf="studioLogoUrl()" [src]="studioLogoUrl()" alt="" class="studio-logo" />
        <div *ngIf="!studioLogoUrl()" class="studio-logo studio-logo-fallback">
          {{ studioName().charAt(0) }}
        </div>
        <div>
          <div class="studio-name">{{ studioName() }}</div>
          <div class="studio-mode">{{ getNotificationModeText() }}</div>
        </div>
      </div>
    </div>

    <!-- Loading Skeleton State -->
    <div *ngIf="isLoading()" class="settings-grid">
      <div class="settings-card" *ngFor="let s of [1, 2, 3, 4]" style="cursor: default;">
        <div class="settings-card-top">
          <div class="skeleton-box" style="width: 2.5rem; height: 2.5rem; border-radius: 0.5rem;"></div>
          <span class="skeleton-line" style="width: 1rem; height: 1rem;"></span>
        </div>
        <div class="settings-card-body" style="width: 100%;">
          <span class="skeleton-line" style="width: 60%; height: 1.1rem; margin-bottom: 6px;"></span>
          <span class="skeleton-line skeleton-line--sm" style="width: 90%;"></span>
        </div>
      </div>
    </div>

    <div *ngIf="error()" class="error-state">
      <p>{{ error() }}</p>
      <button (click)="loadWorkspaceSettings()" class="retry-button">Retry</button>
    </div>

    <div class="settings-grid" *ngIf="!isLoading() && !error()">
      <button
        type="button"
        class="settings-card"
        *ngFor="let card of cards()"
        [class.settings-card-disabled]="card.disabled"
        [disabled]="card.disabled"
        (click)="onCardClick(card)"
      >
        <div class="settings-card-top">
          <div class="settings-icon">
            <svg *ngIf="card.icon === 'branding'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 12h4"></path><path d="M10 8h4"></path><path d="M14 21v-3a2 2 0 0 0-4 0v3"></path>
              <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-7h-2"></path>
              <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path>
            </svg>
            <svg *ngIf="card.icon === 'automation'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M22 8c0-2.3-.8-4.3-2-6"></path>
              <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path>
              <path d="M4 2C2.8 3.7 2 5.7 2 8"></path>
            </svg>
            <svg *ngIf="card.icon === 'email'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect>
            </svg>
            <svg *ngIf="card.icon === 'whatsapp'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path>
            </svg>
          </div>
          <svg class="settings-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </div>

        <div class="settings-card-bottom">
          <h2 class="settings-card-title">{{ card.title }}</h2>
          <p class="settings-card-desc">{{ card.description }}</p>
          <span class="badge badge--outline settings-badge">{{ card.badgeLabel }}</span>
        </div>
      </button>
    </div>

    <div class="settings-footer" *ngIf="!isLoading() && !error()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="settings-footer-icon">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
      Login OTP is always delivered by email, regardless of notification mode.
    </div>
  </ng-container>

  <app-studio-branding
    *ngIf="activeView === 'branding'"
    [logoUrl]="studioLogoUrl()"
    (back)="onBackToGrid()"
    (save)="onBrandingSaved($event)"
  ></app-studio-branding>

  <app-automation-rules
  *ngIf="activeView === 'automation'"
  [crewAssignmentDays]="crewAssignmentDays()"
  (back)="onBackToGrid()"
  (save)="onAutomationSaved($event)"
></app-automation-rules>

<app-email-studio
  *ngIf="activeView === 'email'"
  (back)="onBackToGrid()"
  (save)="onEmailStudioSaved()"
></app-email-studio>
  <!-- automation, email — porer step-e alada component hishebe banabo -->

</div>

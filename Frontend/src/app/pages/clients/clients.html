<div class="clients-page">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Clients</h1>
      <p class="page-subtitle">Manage your client database.</p>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-outline" (click)="onOpenImportModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        Import Excel
      </button>

      <button type="button" class="btn-outline" (click)="onExportExcel()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Export Excel
      </button>

      <button type="button" class="btn-primary" (click)="onNewClient()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14"></path><path d="M12 5v14"></path>
        </svg>
        New Client
      </button>
    </div>
  </div>

  <!-- Card -->
  <div class="clients-card">

    <!-- Filter row -->
    <div class="filter-row">
      <div class="search-field">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input type="text" class="search-input" placeholder="Name, phone, email or customer ID" [(ngModel)]="searchTerm">
      </div>

      <div class="date-field" (click)="clientFromInput.showPicker()">
        <span class="date-field-prefix">From</span>
        <input #clientFromInput type="date" class="date-input" aria-label="Customers created from" [(ngModel)]="dateFrom">
        <button type="button" class="date-calendar-btn" aria-label="Open Calendar">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </button>
      </div>

      <div class="date-field" (click)="clientToInput.showPicker()">
        <span class="date-field-prefix">To</span>
        <input #clientToInput type="date" class="date-input" aria-label="Customers created to" [(ngModel)]="dateTo">
        <button type="button" class="date-calendar-btn" aria-label="Open Calendar">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </button>
      </div>

      <button type="button" class="btn-clear-date" *ngIf="dateFrom || dateTo" (click)="clearDateFilter()" title="Clear date filter">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        Clear
      </button>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-state">
      <p>{{ error }}</p>
      <button type="button" class="btn-outline" (click)="loadClients()">Retry</button>
    </div>

    <!-- Table -->
    <div *ngIf="!error" class="table-wrapper">
      <table class="clients-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Booking Date</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Skeleton Rows while loading -->
          <ng-container *ngIf="loading">
            <tr *ngFor="let s of [1, 2, 3, 4, 5]">
              <td>
                <span class="skeleton-line" style="width: 75%; height: 1rem; margin-bottom: 4px;"></span>
                <span class="skeleton-line skeleton-line--sm" style="width: 45%;"></span>
              </td>
              <td>
                <span class="skeleton-line" style="width: 65%; height: 0.9rem;"></span>
              </td>
              <td>
                <span class="skeleton-line" style="width: 60%; height: 0.9rem;"></span>
              </td>
              <td>
                <span class="skeleton-line" style="width: 70%; height: 0.9rem;"></span>
              </td>
              <td>
                <span class="skeleton-line" style="width: 80%; height: 0.9rem;"></span>
              </td>
              <td class="col-actions">
                <span class="skeleton-line" style="width: 60px; height: 1.75rem; border-radius: 0.375rem;"></span>
              </td>
            </tr>
          </ng-container>

          <tr *ngFor="let client of (loading ? [] : filteredClients)">
            <td>
              <div class="client-name">{{ client.name }}</div>
              <div class="client-id">{{ client.customerId }}</div>
            </td>
            <td class="booking-date-cell">
              <span class="booking-date-badge">{{ client.bookingDate }}</span>
            </td>
            <td>{{ client.phone }}</td>
            <td>{{ client.email }}</td>
            <td class="address-cell">{{ client.address }}</td>
            <td class="col-actions">
              <div class="actions-group">
                <button type="button" class="icon-action-btn" (click)="onEdit(client)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
                  </svg>
                </button>
                <button type="button" class="icon-action-btn icon-action-btn--danger" (click)="onDelete(client)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 11v6"></path><path d="M14 11v6"></path>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                    <path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="filteredClients.length === 0">
            <td colspan="6" class="empty-state">No clients found.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

   <app-client-modal
     [isOpen]="showNewClientModal"
     [editClient]="editClientData"
     (closeModal)="onModalClose()"
     (create)="onClientCreate($event)"
     (update)="onClientUpdate($event)"
   ></app-client-modal>

   <app-import-excel-modal
     [isOpen]="showImportModal"
     [entityName]="'Clients'"
     [columns]="clientImportColumns"
     [sampleRows]="clientSampleRows"
     (close)="showImportModal = false"
     (fileImported)="onImportFile($event)"
   ></app-import-excel-modal>

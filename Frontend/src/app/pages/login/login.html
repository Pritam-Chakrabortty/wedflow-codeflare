<div class="login-page">
  <img class="hero-bg" alt="" aria-hidden="true" src="/assests/images/bg-image.jpg">
  <div class="hero-overlay"></div>

  <a href="javascript:void(0)" (click)="goBack()" routerLink="/" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 19-7-7 7-7"></path>
      <path d="M19 12H5"></path>
    </svg>
    Home
  </a>

  <main>
    <div class="modal-shell">
      <div class="glow-1"></div>
      <div class="glow-2"></div>

      <button class="close-btn" aria-label="Close login" (click)="closeLogin()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-x h-4 w-4" aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>

      <section role="dialog" aria-modal="true" aria-label="WedFlow CRM login" class="login-card">
        <div class="overlay-glow"></div>
        <div class="overlay-pattern"></div>

        <div class="header-block">
          <div class="badge">Admin Access</div>
          <div class="logo-ring">
            <img alt="WedFlow CRM" src="/assests/images/wedflow-logo.png">
          </div>
          <h2 class="title">Welcome back</h2>
          <p class="subtitle">Sign in with the admin email and OTP to continue.</p>
        </div>

        <!-- ===== STEP 1: EMAIL ===== -->
        <form *ngIf="step() === 'email'" (ngSubmit)="onSendOtp()">
          <div class="field-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
              <input id="email" name="email" type="email" required placeholder="admin@gmail.com" [ngModel]="email()"
                (ngModelChange)="email.set($event)">
            </div>
          </div>

          <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

          <button type="submit" [disabled]="isSubmitting()">
            <svg *ngIf="isSubmitting()" class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            {{ isSubmitting() ? 'Sending...' : 'Send OTP' }}
          </button>
        </form>

        <!-- ===== STEP 2: OTP ===== -->
        <form *ngIf="step() === 'otp'" (ngSubmit)="onVerifyOtp()">
          <div class="masked-email-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="masked-email-icon">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            {{ maskedEmail() }}
          </div>

          <input
            class="otp-input"
            type="text"
            inputmode="numeric"
            required
            minlength="6"
            maxlength="6"
            placeholder="000000"
            [ngModel]="otp()"
            (ngModelChange)="otp.set($event)"
            name="otp"
          />

          <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

          <button type="submit" [disabled]="isVerifying() || otp().length !== 6">
            <svg *ngIf="isVerifying()" class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            {{ isVerifying() ? 'Verifying...' : 'Continue' }}
          </button>

          <button type="button" class="use-another-email" (click)="onUseAnotherEmail()">
            Use another email
          </button>
        </form>
      </section>
    </div>
  </main>

  <!-- ===== TOAST ===== -->
  <div class="login-toast" *ngIf="toastVisible()">
    <div class="login-toast-title">{{ toastTitle() }}</div>
    <div class="login-toast-message">{{ toastMessage() }}</div>
  </div>
</div>

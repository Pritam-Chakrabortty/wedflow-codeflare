<div class="dialog-overlay" *ngIf="isOpen" (click)="onCancel()"></div>

<div class="profile-dialog" role="dialog" *ngIf="isOpen" tabindex="-1" (click)="$event.stopPropagation()">
  <div class="dialog-header">
    <div>
      <h2 class="dialog-title">Add Freelancer Profile</h2>
      <p class="dialog-subtitle">
        List a new verified wedding professional or creative team in the marketplace.
      </p>
    </div>
    <button type="button" class="dialog-close" (click)="onCancel()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-close">
        <path d="M18 6 6 18" /><path d="M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="dialog-body">
    <div class="error-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form class="profile-form" (ngSubmit)="onSubmit(profileForm)" #profileForm="ngForm">
      
      <!-- Name & Profile Type -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full / Agency Name <span class="required">*</span></label>
          <input 
            class="form-input" 
            type="text" 
            id="name" 
            name="name" 
            placeholder="e.g. Zack Production"
            [(ngModel)]="formData.name"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="profileType">Profile Type <span class="required">*</span></label>
          <select 
            class="form-select" 
            id="profileType" 
            name="profileType" 
            [(ngModel)]="formData.profileType"
            required>
            <option value="individual">Individual Professional</option>
            <option value="team">Creative Team / Agency</option>
          </select>
        </div>
      </div>

      <!-- Email & Phone -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input 
            class="form-input" 
            type="email" 
            id="email" 
            name="email" 
            placeholder="freelancer@example.com"
            [(ngModel)]="formData.email"
            required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input 
            class="form-input" 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="+91 98765 43210"
            [(ngModel)]="formData.phone">
        </div>
      </div>

      <!-- Specialization & Experience -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="specialization">Primary Specialization <span class="required">*</span></label>
          <select 
            class="form-select" 
            id="specialization" 
            name="specialization" 
            [(ngModel)]="formData.specialization"
            required>
            <option *ngFor="let opt of specializationOptions" [value]="opt">
              {{ opt }}
            </option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="experienceYears">Experience (Years)</label>
          <input 
            class="form-input" 
            type="number" 
            id="experienceYears" 
            name="experienceYears" 
            placeholder="e.g. 5"
            min="0"
            [(ngModel)]="formData.experienceYears">
        </div>
      </div>

      <!-- Skills (comma separated) -->
      <div class="form-group">
        <label class="form-label" for="skillsStr">Skills & Keywords (comma separated)</label>
        <input 
          class="form-input" 
          type="text" 
          id="skillsStr" 
          name="skillsStr" 
          placeholder="e.g. Candid Photography, Drone Pilot, Portrait Colorist"
          [(ngModel)]="formData.skillsStr">
      </div>

      <!-- City, State & Rate -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="city">City</label>
          <input 
            class="form-input" 
            type="text" 
            id="city" 
            name="city" 
            placeholder="e.g. Kolkata"
            [(ngModel)]="formData.city">
        </div>

        <div class="form-group">
          <label class="form-label" for="state">State / Region</label>
          <input 
            class="form-input" 
            type="text" 
            id="state" 
            name="state" 
            placeholder="e.g. WB"
            [(ngModel)]="formData.state">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="rate">Starting Day Rate (₹)</label>
          <input 
            class="form-input" 
            type="number" 
            id="rate" 
            name="rate" 
            placeholder="e.g. 15000"
            min="0"
            [(ngModel)]="formData.rate">
        </div>

        <div class="form-group">
          <label class="form-label" for="portfolioUrl">Portfolio / Website Link</label>
          <input 
            class="form-input" 
            type="url" 
            id="portfolioUrl" 
            name="portfolioUrl" 
            placeholder="https://instagram.com/profile"
            [(ngModel)]="formData.portfolioUrl">
        </div>
      </div>

      <!-- Bio / Summary -->
      <div class="form-group">
        <label class="form-label" for="summary">Bio & Summary</label>
        <textarea 
          class="form-textarea" 
          id="summary" 
          name="summary" 
          rows="3" 
          placeholder="Brief introduction, gear setup, shooting style, and experience summary..."
          [(ngModel)]="formData.summary"></textarea>
      </div>

      <!-- Verified badge toggle -->
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="verified" [(ngModel)]="formData.verified">
          <span>Mark as verified profile (Blue checkmark badge)</span>
        </label>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="profileForm.invalid || isSubmitting">
          <svg *ngIf="isSubmitting" class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <span *ngIf="!isSubmitting">Save Profile</span>
        </button>
      </div>
    </form>
  </div>
</div>

<div class="dialog-overlay" *ngIf="isOpen" (click)="onCancel()"></div>

<div class="brief-dialog" role="dialog" *ngIf="isOpen" tabindex="-1" (click)="$event.stopPropagation()">
  <div class="dialog-header">
    <div>
      <h2 class="dialog-title">Send work brief to {{ professional?.name }}</h2>
      <p class="dialog-subtitle">
        The complete brief and your company contact details will be emailed to this verified profile.
      </p>
    </div>
    <button type="button" class="dialog-close" (click)="onCancel()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-close">
        <path d="M18 6 6 18" /><path d="M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="dialog-body">
    <div class="error-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form class="brief-form" (ngSubmit)="onSubmit(briefForm)" #briefForm="ngForm">
      
      <div class="form-group">
        <label class="form-label" for="projectTitle">Project title <span class="required">*</span></label>
        <input 
          class="form-input" 
          type="text" 
          id="projectTitle" 
          name="projectTitle" 
          placeholder="e.g. Royal Destination Wedding"
          [(ngModel)]="formData.projectTitle"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="recipientEmail">Recipient Email (Freelancer) <span class="required">*</span></label>
        <input 
          class="form-input" 
          type="email" 
          id="recipientEmail" 
          name="recipientEmail" 
          placeholder="e.g. freelancer@example.com"
          [(ngModel)]="formData.recipientEmail"
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="requiredService">Required service <span class="required">*</span></label>
        <select 
          class="form-select" 
          id="requiredService" 
          name="requiredService" 
          [(ngModel)]="formData.requiredService"
          required>
          <option value="" disabled>Select required service</option>
          <option *ngFor="let opt of serviceOptions" [value]="opt">
            {{ opt }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="eventDate">Event date</label>
          <input 
            class="form-input" 
            type="date" 
            id="eventDate" 
            name="eventDate" 
            [(ngModel)]="formData.eventDate">
        </div>

        <div class="form-group">
          <label class="form-label" for="location">Location</label>
          <input 
            class="form-input" 
            type="text" 
            id="location" 
            name="location" 
            placeholder="City, venue or state"
            [(ngModel)]="formData.location">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="budget">Budget (₹)</label>
          <input 
            class="form-input" 
            type="number" 
            id="budget" 
            name="budget" 
            placeholder="e.g. 25000"
            [(ngModel)]="formData.budget">
        </div>

        <div class="form-group">
          <label class="form-label" for="contactPhone">Contact phone</label>
          <input 
            class="form-input" 
            type="tel" 
            id="contactPhone" 
            name="contactPhone" 
            placeholder="+91 98765 43210"
            [(ngModel)]="formData.contactPhone">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="projectBrief">Project brief <span class="required">*</span></label>
        <textarea 
          class="form-textarea" 
          id="projectBrief" 
          name="projectBrief" 
          rows="4" 
          placeholder="Describe event scope, expected deliverables, working hours, and any special requirements..."
          [(ngModel)]="formData.projectBrief"
          required></textarea>
      </div>

      <div class="portfolio-link-wrap">
        <a [href]="professional?.email ? 'mailto:' + professional?.email : '#'" class="portfolio-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Review portfolio before sending
        </a>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="briefForm.invalid || isSubmitting">
          <svg *ngIf="isSubmitting" class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <span *ngIf="!isSubmitting">Send request</span>
        </button>
      </div>
    </form>
  </div>
</div>
